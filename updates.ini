; Where the launcher looks for updates: GitHub repositories, as owner/name, whose releases carry
;   [Launcher]  BWLauncher-<version>-Setup.exe and BWLauncher-<version>-SHA256SUMS.txt (scripts\package.ps1)
;   [Patch]     BWDecomp-<version>.zip and BWDecomp-<version>-SHA256SUMS.txt (the patch's package.ps1)
; Both must be public. The values are built into the launcher (src-tauri\build.rs): change them here and rebuild.
; Players can still pick another repository on the Updates page; an empty setting means the one named here.
;
; Previous: earlier default repositories, separated by commas. A player's setting that still names one of them
; follows the new default instead of staying on the old location.

[Launcher]
Repository = LainLabs/black-and-white-patch-launcher
Previous = konstantine-v/black-and-white-patch-launcher

[Patch]
Repository = LainLabs/black-and-white-patch-tool
Previous = konstantine-v/black-and-white-patch-tool
